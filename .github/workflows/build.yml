name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 mancante: build solo debug (chiave pubblica). Vedi docs/BUILD.md."
          fi
      - run: ./gradlew testDebugUnitTest assembleDebug
      - name: Build signed release
        if: env.KEYSTORE_PATH != ''
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: FastReply-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_PATH != ''
        with:
          name: FastReply-release
          path: app/build/outputs/apk/release/app-release.apk
